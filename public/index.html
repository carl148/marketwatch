<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fintelify</title>
  <meta name="description" content="Finanzwissen für Deutschland: tägliche Lektionen, Quiz, Challenges und Rechner.">
  <meta name="theme-color" content="#1b7a52">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand-row">
        <a class="brand" href="#learn" data-tab="learn"><span class="coin" aria-hidden="true">F</span><h1>Fintelify</h1></a>
        <div class="stats">
          <div class="stat flame" id="streakStat" title="Lernserie in Tagen">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1.2 3 2.3 3C11 8 11 5 12 2z"/></svg>
            <span class="num" id="streakNum">0</span><span class="sr-only">Tage Lernserie</span>
          </div>
          <div class="stat xp" id="xpStat" title="Erfahrungspunkte">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.6z"/></svg>
            <span class="num" id="xpNum">0</span><span class="sr-only">XP</span>
          </div>
          <div class="stat coins" id="coinStat" title="Münzen">
            <span class="coin-sm" aria-hidden="true"></span>
            <span class="num" id="coinNum">0</span><span class="sr-only">Münzen</span>
          </div>
          <div class="stat goal" title="Tagesziel">
            <span class="muted small">Heute</span>
            <div class="goal-bar"><i id="goalFill"></i></div>
            <span class="num small" id="goalNum">0/30</span>
          </div>
        </div>
      </div>
      <nav class="tabs" aria-label="Bereiche">
        <a href="#learn" data-tab="learn">Lernen</a>
        <a href="#review" data-tab="review">Üben <span class="badge" id="reviewBadge" hidden>0</span></a>
        <a href="#tools" data-tab="tools">Rechner</a>
        <a href="#lexicon" data-tab="lexicon">Lexikon</a>
        <a href="#profile" data-tab="profile">Profil</a>
      </nav>
    </header>
    <main id="main"><noscript>Fintelify braucht JavaScript.</noscript></main>
    <footer class="site-foot"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
