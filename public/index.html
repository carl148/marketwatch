<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Groschen</title>
  <meta name="description" content="Finanzwissen für Deutschland: kurze Lektionen, Quiz, Rechner und ein KI-Coach.">
  <meta name="theme-color" content="#1b7a52">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand-row">
        <a class="brand" href="#learn" data-tab="learn"><span class="coin" aria-hidden="true">10</span><h1>Groschen</h1></a>
        <div class="stats">
          <div class="stat flame" id="streakStat" title="Lernserie in Tagen">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1.2 3 2.3 3C11 8 11 5 12 2z"/></svg>
            <span class="num" id="streakNum">0</span><span class="sr-only">Tage Lernserie</span>
          </div>
          <div class="stat xp" title="Erfahrungspunkte">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><circle class="xp-ring" cx="12" cy="12" r="5.5" fill="none" stroke-width="1.5"/></svg>
            <span class="num" id="xpNum">0</span><span class="sr-only">XP</span>
          </div>
          <div class="stat goal" title="Tagesziel">
            <span class="muted small">Heute</span>
            <div class="goal-bar"><i id="goalFill"></i></div>
            <span class="num small" id="goalNum">0/30</span>
          </div>
        </div>
      </div>
      <nav class="tabs" aria-label="Bereiche">
        <a href="#learn" data-tab="learn">Lernen</a>
        <a href="#tools" data-tab="tools">Rechner</a>
        <a href="#review" data-tab="review"><span class="lg">Wiederholen</span><span class="sm">Üben</span> <span class="badge" id="reviewBadge" hidden>0</span></a>
        <a href="#coach" data-tab="coach">Coach</a>
        <a href="#more" data-tab="more">Mehr</a>
      </nav>
    </header>
    <main id="main"><noscript>Groschen braucht JavaScript.</noscript></main>
    <footer class="site-foot"><a href="/impressum">Impressum</a> · <a href="/datenschutz">Datenschutz</a> · <a href="/nutzungsbedingungen">Nutzungsbedingungen</a></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
