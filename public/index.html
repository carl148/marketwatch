<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fintelify</title>
  <meta name="description" content="Finanzwissen für Deutschland: tägliche Lektionen, Quiz, Challenges und Rechner.">
  <meta name="theme-color" content="#0b0d17">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; style-src-attr 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="appbar">
        <a class="hello" href="#learn" data-tab="learn"><span>Hallo,</span> <b id="helloName">Fintelify</b></a>
        <div class="stats">
          <div class="stat flame" id="streakStat" title="Lernserie in Tagen">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1.2 3 2.3 3C11 8 11 5 12 2z"/></svg>
            <span class="num" id="streakNum">0</span><span class="sr-only">Tage Lernserie</span>
          </div>
          <div class="stat coins" id="coinStat" title="Münzen">
            <span class="coin-sm" aria-hidden="true"></span>
            <span class="num" id="coinNum">0</span><span class="sr-only">Münzen</span>
          </div>
          <a class="bell" id="bell" href="#learn" aria-label="Mitteilungen">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a6 6 0 0 0-6 6v3.6L4.3 15A1 1 0 0 0 5.2 16.5h13.6a1 1 0 0 0 .9-1.5L18 11.6V8a6 6 0 0 0-6-6zm0 20a3 3 0 0 0 2.8-2H9.2A3 3 0 0 0 12 22z"/></svg>
            <i class="bell-dot" id="bellDot" hidden></i>
          </a>
          <a class="avatar-sm" id="avatarBtn" href="#profile" data-tab="profile" aria-label="Profil">F</a>
        </div>
      </div>
    </header>
    <main id="main"><noscript>Fintelify braucht JavaScript.</noscript></main>
    <footer class="site-foot"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · <a href="nutzungsbedingungen.html">Nutzungsbedingungen</a></footer>
  </div>
  <nav class="tabs" aria-label="Bereiche">
    <a href="#learn" data-tab="learn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2.5 10.5 4 12.3l1-.8V20a1 1 0 0 0 1 1h4.5v-6h3v6H18a1 1 0 0 0 1-1v-8.5l1 .8 1.5-1.8z"/></svg><span>Lernen</span></a>
    <a href="#review" data-tab="review"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 4a6 6 0 1 1-6 6 6 6 0 0 1 6-6zm0 3.5a2.5 2.5 0 1 0 2.5 2.5A2.5 2.5 0 0 0 12 9.5z"/></svg><span>Üben</span><i class="badge" id="reviewBadge" hidden>0</i></a>
    <a href="#tools" data-tab="tools"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 3v4h10V5zm0 7v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2zm-8 4v2h2v-2zm4 0v2h2v-2zm4 0v2h2v-2z"/></svg><span>Rechner</span></a>
    <a href="#lexicon" data-tab="lexicon"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 3h11a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V4a1 1 0 0 1 1-1zm2 13a1 1 0 0 0 0 2h10v-2zM8 7v2h7V7z"/></svg><span>Lexikon</span></a>
    <a href="#profile" data-tab="profile"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg><span>Profil</span></a>
  </nav>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
